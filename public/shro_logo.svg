<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Cinzel:wght@600&amp;family=Barlow+Condensed:wght@800&amp;family=Inter:wght@500;600&amp;display=swap');
      .brand-box {
        stroke: #2E5C8C;
        stroke-width: 9;
        fill: none;
      }
      .brand-title {
        font-family: 'Barlow Condensed', 'Anton', 'Impact', sans-serif;
        font-size: 112px;
        font-weight: 800;
        fill: #2E5C8C;
        letter-spacing: 2px;
      }
      .brand-est {
        font-family: 'Cinzel', 'Georgia', serif;
        font-size: 28px;
        font-weight: 600;
        fill: #2E5C8C;
      }
      .brand-tagline {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 32px;
        font-weight: 600;
        fill: #208753;
        letter-spacing: -0.2px;
      }
    </style>
  </defs>

  <!-- Enclosing border rectangle with gap at the bottom for Est. 1988 -->
  <!-- Top line -->
  <line x1="8" y1="8" x2="340" y2="8" class="brand-box" />
  <!-- Right line -->
  <line x1="336" y1="4" x2="336" y2="190" class="brand-box" />
  <!-- Left line -->
  <line x1="8" y1="4" x2="8" y2="190" class="brand-box" />
  <!-- Bottom left small line -->
  <line x1="4" y1="186" x2="165" y2="186" class="brand-box" />
  <!-- Est. 1988 in the gap -->
  <text x="172" y="193" class="brand-est">Est. 1988</text>
  <!-- Bottom right closing line -->
  <line x1="298" y1="186" x2="340" y2="186" class="brand-box" />

  <!-- Main Wordmark -->
  <text x="32" y="142" class="brand-title">SHRO</text>
  <text x="355" y="142" class="brand-title">SYSTEMS</text>

  <!-- Tagline -->
  <text x="360" y="188" class="brand-tagline">Digital Transformation Specialists</text>
</svg>
